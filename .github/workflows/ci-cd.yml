name: CI/CD Pipeline

env:
  REGISTRY_NAMESPACE: image/diaryofapolymath

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging
    types: [opened, synchronize, reopened]

jobs:
  test:
    if: (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')) || (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'feature/') && !contains(github.event.pull_request.title, '[skip ci]'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create .env
        run: |
          set -euo pipefail
          cat <<EOF > .env
          ${{ secrets.DOTENV_TEST }}
          EOF
      - name: Build test image
        run: docker build -f Dockerfile.test -t test-image .
      - name: Run tests
        run: docker run --rm test-image
      - name: Remove .env
        if: always()
        run: rm -f .env

  deploy-staging:
    if: github.ref == 'refs/heads/staging' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Create .env
        run: |
          set -euo pipefail
          cat <<EOF > .env
          ${{ secrets.DOTENV_STAGING }}
          EOF
      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build and push
        run: |
          docker buildx build --platform linux/amd64 -f Dockerfile.build -t ${{ secrets.REGISTRY_URL }}/${{ env.REGISTRY_NAMESPACE }}:staging-amd64 --push .
          docker buildx build --platform linux/arm64 -f Dockerfile.build -t ${{ secrets.REGISTRY_URL }}/${{ env.REGISTRY_NAMESPACE }}:staging-arm64 --push .
      - name: Cleanup
        if: always()
        run: |
          rm -f .env
          docker system prune -a -f --volumes

  deploy-production:
    if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Create .env
        run: |
          set -euo pipefail
          cat <<EOF > .env
          ${{ secrets.DOTENV_PROD }}
          EOF
      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build release image
        run: docker build -f Dockerfile.release -t release-image .
      - name: Run release
        run: docker run --rm -v $(pwd):/usr/home/diaryofapolymath release-image
      - name: Get version
        run: echo "VERSION=$(cat __version__)" >> $GITHUB_ENV
      - name: Build and push
        run: |
          docker buildx build --platform linux/amd64 -f Dockerfile.build -t ${{ secrets.REGISTRY_URL }}/${{ env.REGISTRY_NAMESPACE }}:${{ env.VERSION }}-amd64 -t ${{ secrets.REGISTRY_URL }}/${{ env.REGISTRY_NAMESPACE }}:latest-amd64 --push .
          docker buildx build --platform linux/arm64 -f Dockerfile.build -t ${{ secrets.REGISTRY_URL }}/${{ env.REGISTRY_NAMESPACE }}:${{ env.VERSION }}-arm64 -t ${{ secrets.REGISTRY_URL }}/${{ env.REGISTRY_NAMESPACE }}:latest-arm64 --push .
      - name: Cleanup
        if: always()
        run: |
          rm -f .env
          docker system prune -a -f --volumes
