<article style="margin-bottom: var(--global-line-height);">
    <!-- TODO: style this better -->
    <header style="display: flex; justify-content: space-between; align-items: baseline; gap: 1em; opacity: 0.7; font-size: 0.85em; margin-bottom: 0.25em;">
        <span>{{ comment.name|default:comment.email }}</span>
        <time datetime="{{ comment.created_on|date:'c' }}">{{ comment.created_on|date:"N j, Y" }}</time>
    </header>
    <p>{{ comment.content|linebreaksbr }}</p>
    <p>
        <a href="#post-comment-form" data-reply-to="{{ comment.id }}" data-reply-author="{{ comment.name|default:comment.email }}" data-reply-snippet="{{ comment.content|striptags|truncatechars:80 }}">Reply</a>
    </p>

    {% if comment.children %}
    <div style="margin-left: 2em;">
        {% for comment in comment.children %}
            {% include "blog/partials/post_comments/comment_node.html" %}
        {% endfor %}
    </div>
    {% endif %}
</article>
