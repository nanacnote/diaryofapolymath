<aside>
    <div style="position: sticky; top: 25px;">
      <div>
        <h1>{{ copy.common_pinned }}</h1>
        <img style="border-radius: 0.25em;" width="205px" height="auto" alt="{{ copy.common_image_of_sponsor }}" src="https://cdn.metal.bohyen.space/public/diaryofapolymath/pinned-00.webp?w=250&h=250&fit=crop">
      </div>
      <div>
        <h1>{{ copy.common_tags }}</h1>
        <ul>
          {% for tag in tags %}
            <li>
              <a style="display: flex;" href="{% url 'blog:tag' tag.slug %}">
                <span>{{ tag.name }}</span>
                <span style="flex: 1;"></span>
                <span>[{{ tag.count }}]</span>
              </a>
            </li>
          {% endfor%}
        </ul>
      </div>
      <div>
        <h1>{{ copy.common_archive }}</h1>
        <ul>
          {% for archive in archives %}
            <li>
              <a style="display: flex;" href="{% url 'blog:archive' archive.year %}">
                <span>{{ archive.year }}</span>
                <span style="flex: 1;"></span>
                <span>[{{ archive.count }}]</span>
              </a>
            </li>
          {% endfor%}
        </ul>
      </div>
    </div>
</aside>
